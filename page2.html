<!DOCTYPE html>
<html>
<head>
    <title>The Marketplace</title>
    <style>
        /* This tiny bit of CSS makes the 3x2 grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .product {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
    </style>
</head>
<body bgcolor="white" text="black">

    <h1 style="text-align: center;">The Marketplace</h1>
    <p style="text-align: center;">Select an item to see its price:</p>

    <div class="shop-grid">

        <!-- ITEM 1 -->

            <img src="mask1.jpg" alt="Mask">
            <h3><a href="page3.html">The Crying Mask</a></h3>
        </div>

        <!-- ITEM 2 -->
        <div class="product">
            <img src="mask2.jpg" alt="Mask">
            <h3><a href="page4.html">Plague Mask</a></h3>
        </div>

        <!-- ITEM 3 -->
        <div class="product">
            <img src="clothes1.jpg" alt="Clothes">
            <h3><a href="page5.html">The Bloody Coat</a></h3>
        </div>

        <!-- ITEM 4 -->
        <div class="product">
            <img src="item4.jpg" alt="Doll">
            <h3><a href="page6.html">The Cursed Doll</a></h3>
        </div>

        <!-- ITEM 5 -->
        <div class="product">
            <img src="candy.jpg" alt="Candy">

    <hr style="margin-top: 40px;">
    
    <p style="text-align: center;"><a href="page9.html">Proceed to Checkout</a></p>
    <p style="text-align: center;"><a href="index.html">Return to Home</a></p>

</body>
</html>
