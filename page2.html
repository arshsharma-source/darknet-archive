<!DOCTYPE html>
<html>
<head>
    <title>THE MARKETPLACE</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            border: 1px solid #00ff41;
            padding: 20px;
            box-shadow: 0 0 20px #00ff41;
        }
        h1 {
            font-size: 2em;
            text-transform: uppercase;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
        }
        .glitch-img {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            filter: grayscale(100%) contrast(200%) brightness(0.5) sepia(100%) hue-rotate(90deg);
            border: 1px solid #00ff41;
            margin-bottom: 20px;
        }
        a {
            color: #ff003c;
            text-decoration: none;
            border: 1px solid #ff003c;
            padding: 10px 20px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
        a:hover {
            background-color: #ff003c;
            color: black;
            box-shadow: 0 0 15px #ff003c;
        }
        .price {
            color: #ff003c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ITEM #01</h1>
        
        <!-- CHANGE THIS TO YOUR IMAGE FILE NAME -->
        <img src="YOUR-IMAGE-FILENAME.jpg" alt="Item" class="glitch-img">
        
        <p>> BOTTLED MEMORIES.</p>
        <p>> "Experience your best day again. But you'll forget your name."</p>
        <p class="price">> PRICE: ONE SECRET.</p>
        
        <br>
        <a href="page3.html">[ VIEW NEXT ITEM ]</a>
    </div>
</body>
</html>
