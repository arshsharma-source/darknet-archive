<!DOCTYPE html>
<html>
<head>
    <title>THE MIDNIGHT MARKET</title>
    <style>
        body { background-color: #050505; color: #00ff41; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; border: 1px solid #00ff41; padding: 20px; box-shadow: 0 0 20px #00ff41; }
        h1 { font-size: 2em; text-transform: uppercase; border-bottom: 1px solid #00ff41; padding-bottom: 10px; text-align: center; }
        
        .market-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 30px; }
        .item-card { border: 1px solid #00ff41; padding: 10px; text-align: center; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; filter: grayscale(100%) contrast(200%) brightness(0.5) sepia(100%) hue-rotate(90deg); border-bottom: 1px solid #00ff41; margin-bottom: 10px; }
        
        a { color: #ff003c; text-decoration: none; border: 1px solid #ff003c; padding: 10px 20px; display: inline-block; margin-top: 30px; font-weight: bold; }
        a:hover { background-color: #ff003c; color: black; box-shadow: 0 0 15px #ff003c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>WELCOME TO THE MARKETPLACE</h1>
        <p style="text-align:center;">> SELECT AN ITEM.</p>
        
        <div class="market-grid">
            <!-- ITEM 1 -->
            <a href="page3.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item1.jpg" alt="Item 1">
                    <p>BOTTLED MEMORIES</p>
                </div>
            </a>
            <!-- ITEM 2 -->
            <a href="page4.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item2.jpg" alt="Item 2">
                    <p>A SECOND SHADOW</p>
                </div>
            </a>
            <!-- ITEM 3 -->
            <a href="page5.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item3.jpg" alt="Item 3">
                    <p>FUTURE PHONE CALL</p>
                </div>
            </a>
            <!-- ITEM 4 -->
            <a href="page6.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item4.jpg" alt="Item 4">
                    <p>ONE EXTRA HOUR</p>
                </div>
            </a>
            <!-- ITEM 5 -->
            <a href="page7.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item5.jpg" alt="Item 5">
                    <p>STRANGER'S EYES</p>
                </div>
            </a>
            <!-- ITEM 6 -->
            <a href="page8.html" style="border:none; padding:0; margin:0;">
                <div class="item-card">
                    <img src="item6.jpg" alt="Item 6">
                    <p>THE LOCKED BOX</p>
                </div>
            </a>
        </div>
    </div>
</body>
</html>
