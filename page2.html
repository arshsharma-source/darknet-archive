<!DOCTYPE html>
<html>
<head>
    <title>The Marketplace</title>
    <style>
        body {
            background-color: #111; /* Very dark grey background */
            font-family: 'Georgia', serif;
            color: white;
            margin: 40px;
        }

        h1 {
            text-align: center;
            color: #ff4d4d;
            text-shadow: 2px 2px 5px black;
        }

        /* This creates the 3x2 grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); 
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        /* This styles the product boxes */
        .product {
            background-color: black;
            border: 2px solid #8b0000; /* Dark red border */
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 10px #8b0000;
        }

        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            /* Makes the image look dark and spooky */
            filter: grayscale(100%) contrast(150%) brightness(0.5);
            border-bottom: 1px solid #8b0000;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        /* When you hover, the image turns normal! */
        .product:hover img {
            filter: none;
            box-shadow: 0 0 15px white;
        }

        a {
            color: #ff4d4d;
            text-decoration: none;
            font-size: 1.2em;
            font-weight: bold;
        }

        a:hover {
            color: white;
        }

        .footer-link {
            text-align: center;
            margin-top: 40px;
            font-size: 1em;
        }
    </style>
</head>
<body>

    <h1>The Marketplace</h1>
    <p style="text-align: center;">Select an item to see its price:</p>

    <div class="shop-grid">

        <!-- ITEM 1 -->
        <div class="product">
            <img src="mask1.jpg" alt="Mask">
            <h3><a href="page3.html">The Crying Mask</a></h3>
        </div>

        <!-- ITEM 2 -->
        <div class="product">
            <img src="mask2.jpg" alt="Mask">
            <h3><a href="page4.html">Plague Mask</a></h3>
        </div>

        <!-- ITEM 3 -->
        <div class="product">
            <img src="clothes1.jpg" alt="Clothes">
            <h3><a href="page5.html">The Bloody Coat</a></h3>
        </div>

        <!-- ITEM 4 -->
        <div class="product">
            <img src="item4.jpg" alt="Doll">
            <h3><a href="page6.html">The Cursed Doll</a></h3>
        </div>

        <!-- ITEM 5 -->
        <div class="product">
            <img src="candy.jpg" alt="Candy">
            <h3><a href="page7.html">Poison Candy</a></h3>
        </div>

        <!-- ITEM 6 -->
        <div class="product">
            <img src="item6.jpg" alt="Lantern">
            <h3><a href="page8.html">Spirit Lantern</a></h3>
        </div>

    </div>

    <div class="footer-link">
        <p><a href="page9.html">Proceed to Checkout</a></p>
        <p><a href="index.html">Return to Home</a></p>
    </div>

</body>
</html>
