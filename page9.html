<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body {
            /* THIS IS YOUR BACKGROUND IMAGE */
            background-image: url('error.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #111;
            font-family: 'Courier New', Courier, monospace; 
            color: white;
            margin: 40px;
        }
        .story-box {
            max-width: 600px;
            margin: 50px auto;
            background-color: rgba(0, 0, 0, 0.9); 
            padding: 30px;
            border: 2px solid #ff0000; 
            box-shadow: 0 0 20px #ff0000;
        }
        h1 { color: #ff0000; text-align: center; }
        
        /* THIS IS THE IMAGE INSIDE THE BOX */
        img { width: 100%; max-height: 400px; object-fit: cover; border: 1px solid #ff0000; margin-bottom: 20px; }
        
        p { font-size: 1.2em; line-height: 1.6; }
        a { color: #ff003c; text-decoration: none; font-weight: bold; border: 1px solid #ff003c; padding: 10px; display: inline-block; margin-top: 10px;}
        a:hover { background-color: #ff003c; color: black; }
    </style>
</head>
<body>

    <div class="story-box">
        <h1>SYSTEM ERROR</h1>
        
        <!-- This is your warning.jpg -->
        <img src="warning.jpg" alt="Error">
        
        <p>> TRANSACTION FAILED</p>
        <p>> YOU DO NOT HAVE ENOUGH MONEY</p>
        <p>> THE SYSTEM HAS LOCKED YOUR ACCOUNT</p>

        <br>
        <p><a href="page10.html">ACCEPT YOUR FATE</a></p>
    </div>

</body>
</html>
