<!DOCTYPE html>
<html>
<head>
    <title>The Midnight Halloween Market</title>
    <style>
        body {
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: black; 
            font-family: 'Georgia', serif; 
            color: white;
            margin: 0;
            padding: 0;
        }

        .story-text {
            max-width: 800px;
            margin: 150px auto; 
            padding: 20px;
            text-align: center;
            text-shadow: 2px 2px 8px black, -2px -2px 8px black; 
        }

        h1 {
            color: #ff4d4d;
            font-size: 3em;
            text-shadow: 3px 3px 10px black;
        }

        p {
            font-size: 1.3em;
            line-height: 1.6;
            font-weight: bold;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: #8b0000; 
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #ff4d4d;
            transition: 0.3s;
            text-shadow: none; 
        }

        a:hover {
            background-color: #ff4d4d; 
            color: black;
            box-shadow: 0 0 20px #ff4d4d;
        }
    </style>
</head>
<body>

    <div class="story-text">
        <h1>Welcome to the Midnight Market</h1>
        
        <p>Every Halloween, a secret website appears on the dark web. It only stays online for one night.</p>
        
        <p>But be careful. The seller is always watching.</p>
        
        <a href="page2.html">Enter the Marketplace</a>
    </div>

</body>
</html>
